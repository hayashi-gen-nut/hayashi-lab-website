<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="UTF-8"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243144;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#172b4d;color:white;padding:19px 25px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:0}.layout{display:flex;min-height:calc(100vh - 64px)}nav{width:225px;background:white;border-right:1px solid #e6e9ef;padding:15px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:13px;border-radius:9px;font-size:14px;cursor:pointer;color:#42536b}nav button.on{background:#e9f0fc;color:#2458aa;font-weight:700}main{padding:25px;flex:1;max-width:1250px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:white;border:1px solid #e5eaf1;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #18253a08}.stat{font-size:28px;font-weight:750;margin-top:7px}h2{font-size:23px;margin:0 0 20px}h3{font-size:16px;margin:0 0 12px}p,small{color:#6a778a}.pill{font-size:11px;background:#edf1f6;padding:5px 8px;border-radius:12px;display:inline-block}.warning{background:#fff1cc;color:#956800}.success{background:#ddf5e7;color:#18794e}.bad{background:#fde7e7;color:#ac3030}button.primary{background:#2563b9;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button.secondary{background:white;border:1px solid #cfd7e4;border-radius:8px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{border:1px solid #d3dbe6;border-radius:8px;padding:10px;font:inherit;width:100%;background:white}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px;color:#526177}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:15px 0}.wide{grid-column:1/-1}.item{border-bottom:1px solid #eef0f3;padding:12px 0}.item:last-child{border:0}.muted{font-size:12px;color:#748196}.hidden{display:none}.error{background:#ffe6e6;padding:12px;border-radius:8px;color:#9b1c1c;margin-bottom:14px}.tag{font-size:12px;background:#e9effa;border-radius:7px;padding:4px 8px}a{color:#245cb5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:680px){.layout{display:block}nav{width:auto;display:flex;overflow-x:auto;padding:8px}nav button{white-space:nowrap;width:auto}main{padding:14px}.top{padding:14px}.top h1{font-size:16px}}
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:white;padding:12px 0;z-index:3;border-bottom:1px solid #e5eaf1}.doc-nav a{padding:8px 12px;border-radius:20px;background:#eaf0fa;color:#2458aa;text-decoration:none;font-size:13px}.doc-section{scroll-margin-top:80px;padding-top:18px}.doc-section h3{border-bottom:1px solid #e5eaf1;padding-bottom:10px}.doc-item[draggable=true]{cursor:grab}.doc-actions{display:flex;gap:6px;flex-wrap:wrap}.doc-actions button{width:auto}.muted{color:#6a778a}@media(max-width:700px){.doc-nav{position:relative}.doc-actions button{padding:6px 9px}}
.week-legend{display:flex;flex-wrap:wrap;gap:13px;font-size:12px;color:#526177;margin:10px 0 14px}.week-key{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}.week-row{display:flex;align-items:center;gap:10px;margin:9px 0}.week-date{flex:0 0 85px;font-size:13px;color:#42536b}.week-track{height:34px;position:relative;flex:1;border-radius:6px;overflow:hidden;background:#e7f3eb}.week-segment{position:absolute;top:0;height:100%}.week-tick{position:absolute;top:0;height:100%;border-left:1px solid #ffffffaa;pointer-events:none}.week-now{position:absolute;top:0;height:100%;border-left:2px solid #cc3d36;z-index:2;pointer-events:none}.week-axis{display:flex;justify-content:space-between;margin-left:95px;font-size:11px;color:#748196}.week-detail{margin-top:10px;font-size:12px;color:#526177}@media(max-width:550px){.week-date{flex-basis:65px;font-size:11px}.week-row{gap:6px}.week-axis{margin-left:71px}}
.presence-buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.presence-buttons button{min-width:115px;min-height:43px}.presence-buttons button.presence-active{outline:3px solid #2a65bd;outline-offset:2px;font-weight:750}.presence-buttons button:focus-visible{outline:3px solid #2a65bd;outline-offset:2px}@media(max-width:550px){.presence-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.presence-buttons button{min-width:0}}
nav button{line-height:1.35} nav{min-width:190px} @media(max-width:700px){nav{min-width:0}nav button{font-size:12px}}
/* Hourly grid with compact two-hour labels */
.hour-axis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin:10px 0 5px 95px;position:relative;font-size:11px;color:#465b78;font-variant-numeric:tabular-nums}
.hour-axis span{transform:translateX(-50%);white-space:nowrap}
.hour-axis span:last-child{position:absolute;right:0;transform:translateX(50%)}

.presence-large{font-size:16px!important;font-weight:750!important;padding:7px 14px!important;line-height:1.5!important;min-width:84px;text-align:center}
#dashboardPresenceNow .row{min-height:48px;align-items:center}
#dashboardPresenceNow h3{font-size:19px}
@media(max-width:650px){.hour-axis{font-size:9px;margin-left:95px}.hour-axis span:nth-child(even){visibility:hidden}.presence-large{font-size:15px!important;padding:6px 10px!important}}
.member-profile-link{border:0!important;background:transparent!important;padding:0!important;margin:0!important;color:#205bb0!important;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;font-weight:700;text-align:left}.member-profile-link:hover{color:#153a75!important}</style></head><body><header class="top"><h1>Research Lab Manager</h1><span id="account" style="font-size:12px">読み込み中...</span></header><div class="layout"><nav id="nav"></nav><main id="app">読み込み中...</main></div><script>
// GAS web app: all forms are handled by JavaScript. Never allow native form navigation.
// Async inline onsubmit handlers return a Promise (truthy), which otherwise triggers
// a page navigation after Save and leaves the embedded app white/blank.
document.addEventListener('submit', function(event) {
  event.preventDefault();
}, true);
const tabs=[['dashboard','ダッシュボード / Dashboard'],['presence','在室状況 / Presence'],['members','メンバー / Members'],['training','実務訓練 / Practical Training'],['destinations','派遣先 / Destinations'],['meetings','打ち合わせ / Meetings'],['seminars','ゼミ / Seminars'],['outputs','研究業績 / Publications'],['latest','最新論文 / Latest Research'],['thesis','学位論文 / Thesis'],['documents','研究室資料 / Lab Documents']];let state={user:null,tables:{},tab:'dashboard',year:String(new Date().getFullYear()),kind:'all',search:'',selectedMember:'',selectedDestination:''};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=n=>state.tables[n]||[];const by=(n,id)=>t(n).find(x=>x.id===id)||{};const admin=()=>state.user?.role==='admin';const roleLabel=r=>({admin:'管理者',student:'学生',staff:'技術職員',collaborator:'共同研究者'}[r]||r);const field=(name,label,type='text',val='',required=false)=>`<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${required?'required':''}></div>`;const select=(name,label,opts)=>`<div><label>${label}</label><select name="${name}">${opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></div>`;const button=(label,fn,cls='secondary')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;function server(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args))}function notice(e){alert(e.message||e)}async function reload(){try{const stamp=performance.now(),r=await server('apiOverview');state.user=r.user;state.tables=r.tables;rlmLoaded=new Set(Object.keys(r.tables));rlmPending.clear();document.getElementById('account').textContent=`${r.user.name||'研究室管理者'} · ${roleLabel(r.user.role)}`;render();console.info('[RLM performance] initial/reload',Math.round(performance.now()-stamp),'ms')}catch(e){document.getElementById('app').innerHTML=`<div class="error">${esc(e.message)}</div><p>管理者はApps Scriptエディタで setup() を一度実行してください。</p>`}}
// Load screens on demand instead of waiting for every large table at application startup.
const RLM_SCREEN_TABLES={
 dashboard:['Members','Assignments','Outputs','Meetings','Submissions'],
 members:['Members','Meetings'],
 profile:['Members','Meetings','MeetingFiles','Assignments','Submissions','Thesis','Outputs','SeminarPresentations','Seminars','Tasks'],
 training:['Assignments','Submissions','Members','Destinations'],
 destinations:['Destinations','Assignments','Members'],
 meetings:['Meetings','MeetingFiles','Members','Tasks','Destinations'],
 seminars:['Seminars','SeminarPresentations','SeminarFiles','SeminarComments','Members'],
 outputs:['Outputs','Deliverables','Members'],
 thesis:['Thesis','Members'],
 documents:['LabDocuments'],
 presence:['Members'],
 latest:[]
};
let rlmLoaded=new Set(),rlmPending=new Map();
async function rlmEnsureScreen(tab){
 const names=(RLM_SCREEN_TABLES[tab]||[]).filter(n=>!rlmLoaded.has(n));
 if(!names.length)return true;
 const key=names.slice().sort().join('|');
 if(rlmPending.has(key))return false;
 const call=(async()=>{
  try{
   const tables=await server('apiLoadTables',names);
   Object.assign(state.tables,tables);
   names.forEach(n=>rlmLoaded.add(n));
   if(state.tab===tab)render();
  }catch(err){
   const el=document.getElementById('app');
   if(state.tab===tab&&el)el.innerHTML='<div class="error">'+esc(err.message||err)+'</div><button onclick="render()">再試行 / Retry</button>';
  }finally{rlmPending.delete(key)}
 })();
 rlmPending.set(key,call);return false;
}
function rlmSwitchTab(tab){state.tab=tab;render()}
function openMemberProfile(id){state.selectedMember=id;state.tab='profile';render();window.scrollTo(0,0)}
// An ordinary save already returns the complete record. Avoid fetching every table again.
function applySavedRecord(table,record){
 if(!state.tables[table])return false;
 const arr=state.tables[table],i=arr.findIndex(x=>x.id===record.id);
 if(i<0)arr.unshift(record);else arr[i]={...arr[i],...record};
 render();return true;
}
async function saveFast(table,obj){
 const record=await server('apiSave',table,obj);
 // Members affect permissions and identity; refresh them from the server.
 if(table==='Members'){await reload()}else if(!applySavedRecord(table,record)){state.tables[table]=[record];rlmLoaded.add(table);render();}
 return record;
}
function render(){document.getElementById('nav').innerHTML=tabs.filter(([id])=>state.user?.role!=='collaborator'||!['presence','destinations','training'].includes(id)).map(([id,label])=>`<button class="${(state.tab===id||(state.tab==='profile'&&id==='members'))?'on':''}" onclick="rlmSwitchTab('${id}')">${label}</button>`).join('');if((RLM_SCREEN_TABLES[state.tab]||[]).some(n=>!rlmLoaded.has(n))){document.getElementById('app').innerHTML='<div class="card">データを読み込み中... / Loading this section...</div>';rlmEnsureScreen(state.tab);return;}document.getElementById('app').innerHTML=views[state.tab]();if(state.tab==='seminars'&&seminarSelected)loadSeminarLive();if(state.tab==='presence'&&state.user?.role!=='collaborator')loadPresence();if(state.tab==='dashboard'&&state.user?.role!=='collaborator')loadDashboardPresence();if(state.tab==='latest')loadLatestResearch();if(state.tab==='meetings'&&admin())loadClassSchedules();if(state.tab==='destinations'&&state.editDestinationId){const c=document.querySelector('select[name=category]');if(c)c.value=by('Destinations',state.editDestinationId).category||'university'}if(admin())renderRecordManager()}async function save(table,form){const obj=Object.fromEntries(new FormData(form).entries());try{await saveFast(table,obj)}catch(e){notice(e)}return false}function yearPicker(){const ys=[...new Set([...t('Assignments').map(x=>x.year),String(new Date().getFullYear()),String(new Date().getFullYear()-1)])].sort().reverse();return `<select style="max-width:160px" onchange="state.year=this.value;render()">${ys.map(y=>`<option ${y===state.year?'selected':''}>${esc(y)}</option>`).join('')}</select>`}const status=(s)=>`<span class="pill ${/complete|accepted|submitted|done|提出済/i.test(s)?'success':/not submitted|rejected|overdue/i.test(s)?'bad':'warning'}">${esc(s||'準備中')}</span>`;
const views={
latest(){return `<h2>最新国際ジャーナル論文</h2><p>研究室の出版実績とは別に、登録した学術誌の最新論文をCrossrefから取得します。</p><div class="card"><div class="row" style="flex-wrap:wrap"><div><label>出版期間</label><select id="latestDays" onchange="latestDays=Number(this.value);loadLatestResearch()"><option value="7" ${latestDays===7?'selected':''}>過去7日</option><option value="30" ${latestDays===30?'selected':''}>過去30日</option><option value="90" ${latestDays===90?'selected':''}>過去90日</option></select></div><div><label>雑誌</label><select id="latestJournal" onchange="latestJournal=this.value;drawLatestResearch()"><option value="all">すべての雑誌</option></select></div><div class="actions"><button class="secondary" onclick="loadLatestResearch()">再表示</button>${admin()?'<button class="secondary" onclick="loadLatestResearch(true)">最新データを取得</button>':''}</div></div><p class="muted">掲載日が新しい順。タイトルを押すとDOIの論文ページが開きます。</p></div>${admin()?`<div class="card"><details><summary>雑誌の登録・管理（管理者）</summary><form class="form" onsubmit="return addLatestJournal(event)">${field('name','雑誌名','text','',true)}${field('issn','ISSN（例：0141-0296）','text','',true)}<div class="wide"><button class="primary">雑誌を追加</button></div></form><div id="latestManage"></div></details></div>`:''}<div id="latestResults" class="card">読み込み中...</div>`},
seminars(){return renderSeminars()},
documents(){const cats=['基本情報','実験・安全','研究・論文','実務訓練','申請・事務','その他'];return `<h2>Lab Documents · 研究室資料</h2><p>カテゴリを選ぶとページ内の該当箇所へ移動します。すべての資料を1ページで閲覧できます。</p>${admin()?`<div class="card"><h3>管理者：PDFを登録</h3><form class="form" onsubmit="return uploadLabDoc(event)">${field('title','資料名','text','',true)}${select('category','カテゴリ',cats.map(x=>[x,x]))}${select('visibility','公開範囲',[['lab','研究室内のみ'],['admin','管理者のみ'],['collaborators','共同研究者のみ']])}<div><label>PDFファイル（8MB以下）</label><input type="file" name="file" accept=".pdf,application/pdf" required></div><div class="wide"><label>説明</label><textarea name="description"></textarea></div><div class="wide"><button class="primary">PDFを登録</button></div></form></div>`:''}<div class="card"><input placeholder="資料名・説明を検索" oninput="state.docQuery=this.value;document.getElementById('docRows').innerHTML=documentRows()"><div id="docRows">${documentRows()}</div></div>`},

presence(){return `<h2>在室・スケジュール</h2><div class="card"><h3>先生の対応状況</h3><div id="professorStatus">読み込み中...</div><div id="weeklySchedule" style="margin-top:18px">週間予定を読み込み中...</div>${admin()?`<details style="margin-top:12px"><summary>予定連携の詳細設定（管理者）</summary><div class="form">${field('desknetIcsUrl','desknet\'s NEOの予定取得URL（HTTP/HTTPS・ICS）')}<div class="wide"><button class="secondary" onclick="configureDesknet(this)">連携設定を保存</button><button type="button" class="secondary" onclick="testDesknet(this)">接続テスト</button></div></div></details>`:''}</div><div class="card"><h3>自分の在室状況</h3><div id="myAttendance" class="muted">現在の状況を確認中...</div><div class="presence-buttons" role="group" aria-label="在室状況の切り替え"><button data-presence="在室" class="primary" onclick="attendanceAction(this,'在室')">出勤・在室</button><button data-presence="帰宅" class="secondary" onclick="attendanceAction(this,'帰宅')">退勤</button><button type="button" data-presence="オンライン会議" class="secondary" onclick="quickPresence(this,'オンライン会議')">オンライン会議 / Online meeting</button><button type="button" data-presence="授業" class="secondary" onclick="quickPresence(this,'授業')">授業 / Class</button><button type="button" data-presence="打ち合わせ" class="secondary" onclick="quickPresence(this,'打ち合わせ')">打ち合わせ / Meeting</button><button type="button" data-presence="学内" class="secondary" onclick="quickPresence(this,'学内')">学内 / On campus</button><button type="button" data-presence="昼食" class="secondary" onclick="quickPresence(this,'昼食')">昼食 / Lunch</button><button type="button" data-presence="実験室" class="secondary" onclick="quickPresence(this,'実験室')">実験室 / Laboratory</button><button type="button" data-presence="外出" class="secondary" onclick="quickPresence(this,'外出')">外出 / Away</button></div><details style="margin-top:12px"><summary>自動復帰の設定（必要な場合のみ）</summary><div class="form"><div><label>復帰時刻</label><input name="presenceUntil" type="datetime-local"></div>${select('presenceReturn','復帰後の状況',[['在室','在室'],['実験室','実験室'],['帰宅','帰宅']])}<div class="wide"><button class="secondary" onclick="schedulePresenceReturn(this)">現在の状態に自動復帰を設定</button></div></div></details></div>${admin()?`<div class="card"><h3>管理者専用・状態別時間集計</h3><div class="row"><input id="reportMonth" type="month" value="${new Date().toISOString().slice(0,7)}" style="max-width:190px"><button class="secondary" onclick="loadPresenceReport()">集計を表示</button></div><div id="presenceReport"></div></div>`:''}`},
dashboard(){const a=t('Assignments').filter(x=>x.year===state.year),up=t('Outputs').filter(x=>!['Accepted','Rejected','Not Submitted','Withdrawn'].includes(x.status));const meetings=t('Meetings').filter(x=>x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,6);return `<div class="row"><h2>ダッシュボード / Dashboard</h2>${yearPicker()}</div><div class="grid"><div class="card">メンバー / Members<div class="stat">${t('Members').filter(x=>x.active!=='false').length}</div></div><div class="card">実務訓練 / Training<div class="stat">${a.length}</div></div><div class="card">打ち合わせ予定 / Meetings<div class="stat">${meetings.length}</div></div><div class="card">進行中の研究業績 / Active outputs<div class="stat">${up.length}</div></div></div><div class="grid"><div class="card"><h3>今後の打ち合わせ / Upcoming meetings</h3>${meetings.length?meetings.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.date)} ${esc(x.start)}–${esc(x.end)} · ${esc(x.method)}</div><small>${(x.participants||'').split(',').map(id=>by('Members',id).name).filter(Boolean).map(esc).join(' · ')}</small></div>`).join(''):'<p>予定された打ち合わせなし / No upcoming meetings</p>'}</div><div class="card"><h3>実務訓練の提出状況 / Training submissions · ${state.year}</h3>${a.length?a.map(x=>{const files=t('Submissions').filter(s=>s.assignmentId===x.id);return `<div class="item"><button type="button" class="member-profile-link" onclick="openMemberProfile('${esc(x.memberId)}')">${esc(by('Members',x.memberId).name||by('Members',x.memberId).nameJa)}</button> · ${esc(x.kind)}<div class="muted">${esc(x.topic)}</div><small>${files.length} uploaded files</small></div>`}).join(''):'<p>実務訓練の登録なし / No training assignments</p>'}</div></div>`},
members(){return `<div class="row"><h2>メンバー</h2></div>${admin()?`<div class="card"><h3>メンバー登録</h3><form onsubmit="return inviteMember(this)" class="form">${field('nameJa','日本語氏名 / Japanese name','text','',false)}${field('nameEn','英語氏名 / English name','text','',false)}${field('email','ログイン用メールアドレス','email','',true)}${select('role','区分',[['student','学生'],['staff','技術職員'],['collaborator','共同研究者']])}${select('grade','学年・所属',[['B4','B4'],['M1','M1'],['M2','M2'],['D1','D1'],['D2','D2'],['D3','D3'],['Staff','技術職員'],['External','External']])}<input type="hidden" name="active" value="true"><div class="wide">${button('招待者を登録','', 'primary').replace('onclick=""','type="submit"')}</div></form></div>`:''}<div class="card">${t('Members').map(x=>`<div class="item row"><div><button type="button" class="member-profile-link" onclick="openMemberProfile('${esc(x.id)}')">${esc([x.nameJa,x.nameEn].filter(Boolean).join(' / ')||x.name)}</button><div class="muted">${esc(x.grade)} · ${esc(roleLabel(x.role))} · 打合せ ${memberMeetingCount(x.id)}回 / ${memberMeetingCount(x.id)} meetings</div></div><span class="tag">${esc(x.active==='false'?'無効':'有効')}</span>${admin()?button(x.active==='false'?'有効化':'アクセス停止',`setMemberAccess('${x.id}',${x.active==='false'})`):''}</div>`).join('')||'<p>登録メンバーはいません</p>'}</div>`},
profile(){
 const id=state.selectedMember,m=by('Members',id);
 if(!m.id)return `<h2>学生別記録</h2><div class="card">メンバー一覧から学生を選択してください。<button onclick="rlmSwitchTab('members')">戻る</button></div>`;
 const name=[m.nameJa,m.nameEn].filter(Boolean).join(' / ')||m.name||'未登録';
 const owned=t('Meetings').filter(x=>x.primaryMemberId===id).slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
 const attended=t('Meetings').filter(x=>x.primaryMemberId!==id&&(x.participants||'').split(',').includes(id)).slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
 const as=t('Assignments').filter(x=>x.memberId===id).slice().sort((a,b)=>String(b.year).localeCompare(String(a.year)));
 const subs=t('Submissions').filter(x=>as.some(a=>a.id===x.assignmentId));
 const presentations=t('SeminarPresentations').filter(x=>x.memberId===id);
 const seminars=presentations.map(x=>({p:x,s:by('Seminars',x.seminarId)})).sort((a,b)=>(b.s.date||'').localeCompare(a.s.date||''));

function sortedDocs(){return [...t('LabDocuments')].filter(d=>d.active!=='false').sort((a,b)=>(Number(a.sortOrder)||999999)-(Number(b.sortOrder)||999999)||String(a.uploadedAt).localeCompare(String(b.uploadedAt)))}
function documentRows(){const q=(state.docQuery||'').toLowerCase();const docs=sortedDocs().filter(d=>[d.title,d.category,d.description].join(' ').toLowerCase().includes(q));const categories=['基本情報','実験・安全','研究・論文','実務訓練','申請・事務','その他',...new Set(docs.map(d=>d.category))].filter((x,i,a)=>a.indexOf(x)===i&&docs.some(d=>d.category===x));const nav=`<div class="doc-nav">${categories.map((c,i)=>`<a href="#doc-section-${i}" onclick="event.preventDefault();document.getElementById('doc-section-${i}').scrollIntoView({behavior:'smooth',block:'start'})">${esc(c)}</a>`).join('')}</div>`;return docs.length?nav+categories.map((cat,i)=>`<section class="doc-section" id="doc-section-${i}"><h3>${esc(cat)} <span class="muted">${docs.filter(d=>d.category===cat).length}件</span></h3>${docs.filter(d=>d.category===cat).map(d=>`<div class="item doc-item" ${admin()?`draggable="true" ondragstart="docDragStart(event,'${esc(d.id)}')" ondragover="event.preventDefault()" ondrop="docDrop(event,'${esc(d.id)}')"`:''}><div class="row"><div>${admin()?'<span class="muted" title="ドラッグして順番変更">☰ </span>':''}<b>${esc(d.title)}</b><div class="muted">v${esc(d.version)} · ${esc((d.uploadedAt||'').slice(0,10))}</div><small>${esc(d.description)}</small></div><div class="doc-actions"><button class="secondary" onclick="openLabDoc('${esc(d.fileId)}')">PDFを開く</button>${admin()?`<button class="secondary" title="上へ" onclick="moveLabDoc('${esc(d.id)}',-1)">↑</button><button class="secondary" title="下へ" onclick="moveLabDoc('${esc(d.id)}',1)">↓</button>`:''}</div></div></div>`).join('')}</section>`).join(''):'<p>登録された資料はありません。</p>'}
let draggedDocId=null;function docDragStart(e,id){draggedDocId=id;e.dataTransfer.effectAllowed='move'}
async function docDrop(e,targetId){e.preventDefault();if(!admin()||!draggedDocId||draggedDocId===targetId)return;const docs=sortedDocs(),from=docs.findIndex(d=>d.id===draggedDocId),to=docs.findIndex(d=>d.id===targetId);draggedDocId=null;if(from<0||to<0||docs[from].category!==docs[to].category){notice('並べ替えは同じカテゴリ内で行ってください');return}const item=docs.splice(from,1)[0];docs.splice(to,0,item);await persistDocOrder(docs)}
async function moveLabDoc(id,delta){const docs=sortedDocs(),idx=docs.findIndex(d=>d.id===id);if(idx<0)return;const cat=docs[idx].category,subset=docs.filter(d=>d.category===cat),pos=subset.findIndex(d=>d.id===id),next=subset[pos+delta];if(!next)return;const j=docs.findIndex(d=>d.id===next.id);[docs[idx],docs[j]]=[docs[j],docs[idx]];await persistDocOrder(docs)}
async function persistDocOrder(docs){try{await server('apiReorderLabDocuments',docs.map(d=>d.id));docs.forEach((d,i)=>d.sortOrder=(i+1)*10);document.getElementById('docRows').innerHTML=documentRows()}catch(e){notice(e)}}
async function openLabDoc(id){try{const url=await server('apiLabDocumentUrl',id);window.open(url,'_blank')}catch(e){notice(e)}}
async function uploadLabDoc(e){e.preventDefault();const f=e.target,file=f.file.files[0];if(!file||!file.name.toLowerCase().endsWith('.pdf')||file.size>8*1024*1024){notice('8MB以下のPDFを選択してください');return false}const r=new FileReader();r.onload=async()=>{const btn=f.querySelector('button');try{btn.disabled=true;await server('uploadLabDocument',{title:f.title.value,category:f.category.value,visibility:f.visibility.value,description:f.description.value,filename:file.name,base64:r.result.split(',')[1]});await reload()}catch(err){notice(err)}finally{btn.disabled=false}};r.readAsDataURL(file);return false}
function showUpload(id){document.getElementById('uploadSlot').innerHTML=`<div class="card"><h3>Upload monthly submission</h3><form onsubmit="upload(event,'${id}')" class="form">${field('month','Submission month','month',new Date().toISOString().slice(0,7),true)}${select('docType','Document type',[['TrainingLog','Training log'],['TrainingReport','Training report'],['ResearchReport','Research project report']])}<div><label>PDF / Excel</label><input name="file" type="file" accept=".pdf,.xlsx,.xls" required></div><div class="wide"><button class="primary">アップロード / Upload file</button></div></form><small>Max 8 MB per file. Files are private by default.</small></div>`;document.getElementById('uploadSlot').scrollIntoView({behavior:'smooth'})}async function upload(e,id){e.preventDefault();const f=e.target;const file=f.file.files[0];if(!file||file.size>8*1024*1024){notice('Choose a file under 8 MB');return}const r=new FileReader();r.onload=async()=>{try{f.querySelector('button').disabled=true;await server('uploadPdfOrExcel',{assignmentId:id,month:f.month.value,docType:f.docType.value,filename:file.name,base64:r.result.split(',')[1]});await reload()}catch(err){notice(err);f.querySelector('button').disabled=false}};r.readAsDataURL(file)}async function openFile(id){try{const url=await server('apiFileUrl',id);window.open(url,'_blank')}catch(e){notice(e)}}async function loadDashboardPresence(){
 const root=document.getElementById('app');if(!root)return;
 let panel=document.getElementById('dashboardPresenceNow');
 if(!panel){panel=document.createElement('div');panel.id='dashboardPresenceNow';panel.className='card';root.insertBefore(panel,root.children[1]||null)}
 panel.innerHTML='<h3>現在の在室状況 / Current Presence</h3><span class="muted">読み込み中 / Loading...</span>';
 try{
  const p=await server('apiPresence');
  if(state.tab!=='dashboard'||!document.getElementById('dashboardPresenceNow'))return;
  const badge=(value)=>`<span class="pill presence-large ${value==='在室'?'success':value==='帰宅'?'bad':'warning'}">${esc(value||'未設定')}</span>`;

  const rows=(p.rows||[]).map(x=>`<div class="row" style="padding:7px 0;border-top:1px solid #edf0f5"><span>${esc(x.name)}${x.grade?' <small class="muted">('+esc(x.grade)+')</small>':''}</span>${badge(x.status)}</div>`).join('');
  panel.innerHTML=`<h3>現在の在室状況 / Current Presence</h3><div class="row" style="padding:8px 0"><b>教員 / Professor</b>${badge(mine?.status)}</div><div style="border-top:1px solid #e5e7eb;padding-top:8px"><b>学生・技術職員 / Students & Staff</b>${rows||'<p class="muted">登録なし / No members</p>'}</div>`;
 }catch(e){if(state.tab==='dashboard'&&document.getElementById('dashboardPresenceNow'))panel.innerHTML='<h3>現在の在室状況 / Current Presence</h3><span class="muted">取得できません / Unavailable</span>'}
}
let scheduleStartDate='';let scheduleRangeDays=7;
function scheduleLocalToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function scheduleAddDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
async function changeScheduleRange(action,value){
 const today=scheduleLocalToday();if(!scheduleStartDate)scheduleStartDate=today;
 if(action==='today')scheduleStartDate=today;
 else if(action==='date')scheduleStartDate=value;
 else if(action==='next')scheduleStartDate=scheduleAddDays(scheduleStartDate,scheduleRangeDays);
 else if(action==='prev')scheduleStartDate=scheduleAddDays(scheduleStartDate,-scheduleRangeDays)<today?today:scheduleAddDays(scheduleStartDate,-scheduleRangeDays);
 else if(action==='days')scheduleRangeDays=Number(value);

function weeklyScheduleHtml(c){
 if(!c.connected&&!c.internalConnected)return `<div class="muted">${esc(c.error||'desknet&#39;s NEOのICS購読URLが未設定です。管理者が設定してください。')}</div>`;
 const days=c.days||[];const today=scheduleLocalToday();const first=c.rangeStart||days[0]?.date||today;const range=c.rangeDays||days.length||7;const atToday=first===today;
 const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
 const dayName=d=>{const x=new Date(d+'T12:00:00+09:00');return `${Number(d.slice(5,7))}/${Number(d.slice(8,10))} (${['日','月','火','水','木','金','土'][x.getDay()]})`};
 const current=new Date(c.now||Date.now());
 const mins=current.getHours()*60+current.getMinutes();
 return `<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px"><h3 style="margin:0">予定（24時間）</h3><div class="row" style="flex-wrap:wrap;gap:6px;align-items:center"><button class="secondary" onclick="changeScheduleRange('today')">今日から</button><button class="secondary" onclick="changeScheduleRange('prev')">◀ 前へ</button><button class="secondary" onclick="changeScheduleRange('next')">次へ ▶</button><label style="font-size:12px">開始日 <input type="date" min="${today}" value="${first}" onchange="changeScheduleRange('date',this.value)" style="width:145px"></label><label style="font-size:12px">期間 <select onchange="changeScheduleRange('days',this.value)">${[7,14,30].map(n=>`<option value="${n}" ${range===n?'selected':''}>${n}日間</option>`).join('')}</select></label></div></div><div class="week-legend"><span><i class="week-key" style="background:#e7f3eb"></i>登録予定なし</span><span><i class="week-key" style="background:#8794a6"></i>予定あり</span><span><i class="week-key" style="background:#527fb7"></i>出張</span><span><i class="week-key" style="background:#d5a451"></i>授業</span><span><i class="week-key" style="background:#9878b4"></i>学生打ち合わせ</span></div><div class="hour-axis">${Array.from({length:13},(_,i)=>`<span>${String(i*2).padStart(2,'0')}</span>`).join('')}</div>${days.map((day,i)=>`<div class="week-row"><div class="week-date">${esc(dayName(day.date))}</div><div class="week-track" role="img" aria-label="${esc(day.date)}の予定">${Array.from({length:23},(_,i)=>`<span class="week-tick" style="left:${(i+1)*100/24}%;border-left:${(i+1)%2===0?'1px solid #ffffffbb':'1px dotted #ffffff88'}"></span>`).join('')}${(day.segments||[]).map(seg=>`<span class="week-segment" style="left:${seg.startMinute/14.4}%;width:${(seg.endMinute-seg.startMinute)/14.4}%;background:${seg.type==='trip'?'#527fb7':seg.type==='class'?'#d5a451':seg.type==='meeting'?'#9878b4':'#8794a6'}" title="${seg.type==='trip'?'出張':seg.type==='class'?'授業':seg.type==='meeting'?'学生打ち合わせ':'予定あり'} ${fmt(seg.startMinute)}–${fmt(seg.endMinute)}"></span>`).join('')}${day.date===today?`<span class="week-now" style="left:${Math.min(100,Math.max(0,mins/14.4))}%"></span>`:''}</div></div>`).join('')}`;
}
// Status-to-entry mapping. Keep calendar availability separate from manual presence.
function entryLabel(status){
 const s=String(status||'');
 if(s==='在室')return '入室可';
 if(s==='オンライン会議')return '入室不可';
 if(['学生打ち合わせ','打ち合わせ'].includes(s))return '緊急時対応可';
 if(['授業','実験室','学内','外出','昼食','帰宅','出張'].includes(s))return '不在';
 return '未設定';
}

<div class="card"><label>開催回を選択</label><select onchange="seminarSelected=this.value;seminarDraft=[];render()">${all.map(x=>`<option value="${esc(x.id)}" ${sem?.id===x.id?'selected':''}>${esc(x.date)} · ${esc(seminarLabel(x.groups))} · ${esc(x.title)}</option>`).join('')}</select></div>
${!sem?'<p>まだゼミはありません。</p>':`<div class="card"><div class="row"><h3>${esc(sem.title)}</h3>${admin()?`<button class="${locked?'secondary':'primary'}" onclick="toggleSeminarLock('${esc(sem.id)}',${!locked})">${locked?'編集を再開 / Unlock':'確定する / Finalize'}</button>`:''}</div><p>${esc(sem.date)} ${esc(sem.start)}–${esc(sem.end)} · ${esc(sem.location)} · ${esc(seminarLabel(sem.groups))}</p><p>${locked?'確定後は管理者のみ編集できます。':'学生も議事次第・議事録・発表順を編集できます。'}</p></div>
<div class="card"><details><summary>議事次第・議事録を編集</summary><h3>議事次第</h3><textarea id="seminarAgenda" rows="6" ${canEdit?'':'readonly'}>${esc(sem.agendaText||'')}</textarea>${canEdit?`<div class="actions"><button class="primary" onclick="saveSeminarText('agendaText')">保存 / Save</button></div>`:''}
<h3>前回の議事録</h3>${prev||'<p>前回のPDF参照はありません。</p>'}<h3>今回の議事録 / Minutes</h3><textarea id="seminarMinutes" rows="6" ${canEdit?'':'readonly'}>${esc(sem.minutesText||'')}</textarea>${canEdit?`<div class="actions"><button class="primary" onclick="saveSeminarText('minutesText')">保存</button></div>`:''}</details></div>
<div class="card"><details><summary>発表順・時間割を編集</summary><h3>発表者と持ち時間</h3><div class="muted">持ち時間を入力すると開始・終了時刻を自動計算します。発表順を変更すると時間も更新されます。</div><div id="seminarTimeWarning" class="muted"></div><div id="seminarPresenters">${(seminarDraft.length?seminarDraft:ps).map((x,i)=>seminarPresenterRow(x,i,members,canEdit)).join('')}</div>${canEdit?`<div class="actions"><button class="secondary" onclick="addSeminarPresenter()">＋ 発表者を追加</button><button class="primary" onclick="saveSeminarPresenters()">発表順と時間を保存</button></div>`:''}</details></div>
${sem?`<div class="card" id="seminarLivePanel"><div class="row"><h3>当日の進行・議事録</h3><span class="pill">${esc(sem.liveStatus||"ready")}</span></div><div id="liveBody"><p class="muted">進行状況を読み込みます...</p></div></div>`:""}
<div class="card"><details><summary>発表資料・コメント</summary><h3>発表資料・コメント</h3>${ps.map((x,i)=>{const f=files.filter(y=>y.presentationId===x.id).sort((a,b)=>Number(b.version)-Number(a.version))[0];const comments=t('SeminarComments').filter(c=>c.presentationId===x.id);return `<div class="item"><b>${String(i+2).padStart(2,'0')} ${esc(names[x.memberId]||x.memberId)}</b> · ${esc(x.start||'--:--')}–${esc(x.end||'--:--')} · ${esc(x.title)}<div class="muted">${f?`<a href="#" onclick="openSeminarPdf('${esc(f.fileId)}');return false">${esc(f.fileName)}</a>`:'未提出 / Not uploaded'}</div>${comments.map(c=>`<p>💬 ${esc(c.body)}</p>`).join('')}${canEdit?`<textarea id="comment_${esc(x.id)}" rows="2" placeholder="コメント / Comment"></textarea><button class="secondary" onclick="addSeminarComment('${esc(x.id)}')">コメント追加</button>`:''}${canEdit&&(admin()||state.user?.id===x.memberId)?`<div class="actions"><input type="file" accept=".pdf,application/pdf" id="pdf_${esc(x.id)}" style="max-width:300px"><button class="secondary" onclick="uploadSeminarFile('${esc(x.id)}')">PDF提出</button></div>`:''}</div>`}).join('')}</div>`}`}
function seminarPresenterRow(x,i,members,editable){const disabled=editable?'':'disabled';const duration=Number(x.durationMinutes)||Math.max(1,clockMinutes(x.end||'13:20')-clockMinutes(x.start||'13:00'))||20;return `<div class="item" data-presenter="${esc(x.id||'')}"><div class="form"><div><label>${i+1}. 発表者 / Presenter</label><select class="sp-member" ${disabled}>${members.map(m=>`<option value="${esc(m.id)}" ${x.memberId===m.id?'selected':''}>${esc([m.nameJa,m.nameEn].filter(Boolean).join(' / ')||m.name)}</option>`).join('')}</select></div>${field('spTitle','発表題目 / Title','text',x.title||'')}<div><label>持ち時間（分） / Duration (min)</label><input type="number" class="sp-duration" min="1" max="240" value="${duration}" ${disabled} oninput="recalculateSeminarTimes()"></div><div><label>開始 / Start</label><input class="sp-start" value="${esc(x.start||'')}" readonly></div><div><label>終了 / End</label><input class="sp-end" value="${esc(x.end||'')}" readonly></div></div>${editable?`<div class="actions"><button class="secondary" onclick="moveSeminarPresenter(this,-1)">↑</button><button class="secondary" onclick="moveSeminarPresenter(this,1)">↓</button><button class="secondary" onclick="this.closest('.item').remove();recalculateSeminarTimes()">削除</button></div>`:''}</div>`}
function clockMinutes(t){const m=/^(\d{2}):(\d{2})$/.exec(String(t));return m?Number(m[1])*60+Number(m[2]):0}
function minutesClock(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function recalculateSeminarTimes(){const sem=t('Seminars').find(x=>x.id===seminarSelected);if(!sem)return;let cursor=clockMinutes(sem.start);const end=clockMinutes(sem.end);const items=[...document.querySelectorAll('#seminarPresenters .item')];items.forEach((x,i)=>{const dur=Number(x.querySelector('.sp-duration').value)||0;x.querySelector('.sp-start').value=minutesClock(cursor);cursor+=dur;x.querySelector('.sp-end').value=minutesClock(cursor);const lbl=x.querySelector('label');if(lbl)lbl.textContent=(i+1)+'. 発表者 / Presenter'});const warning=document.getElementById('seminarTimeWarning');if(warning)warning.textContent=cursor>end?'⚠ 発表時間の合計がゼミ終了時刻を超えています。':'発表終了予定：'+minutesClock(cursor)+' / Seminar ends: '+sem.end}
async function createSeminarUI(form){const d=Object.fromEntries(new FormData(form).entries());d.groups=[...form.querySelectorAll('[name=groups]:checked')].map(x=>x.value).join(',');try{const r=await server('apiCreateSeminar',d);seminarSelected=r.id;await reload()}catch(e){notice(e)}return false}
async function saveSeminarText(kind){try{await server('apiEditSeminarText',seminarSelected,kind,document.getElementById(kind==='agendaText'?'seminarAgenda':'seminarMinutes').value);await reload()}catch(e){notice(e)}}
async function toggleSeminarLock(id,locked){if(locked&&!confirm('確定後、学生は編集できなくなります。確定しますか？'))return;try{await server('apiSetSeminarLocked',id,locked);await reload()}catch(e){notice(e)}}
function addSeminarPresenter(){const root=document.getElementById('seminarPresenters');root.insertAdjacentHTML('beforeend',seminarPresenterRow({memberId:t('Members')[0]?.id||'',title:'',start:'13:00',end:'13:20',durationMinutes:20},root.children.length,t('Members'),true));recalculateSeminarTimes()}
function moveSeminarPresenter(btn,dir){const x=btn.closest('.item'),p=x.parentElement,s=dir<0?x.previousElementSibling:x.nextElementSibling;if(!s)return;if(dir<0)p.insertBefore(x,s);else p.insertBefore(s,x);recalculateSeminarTimes()}
async function saveSeminarPresenters(){const data=[...document.querySelectorAll('#seminarPresenters .item')].map(x=>({id:x.dataset.presenter||'',memberId:x.querySelector('.sp-member').value,title:x.querySelector('[name=spTitle]').value,durationMinutes:Number(x.querySelector('.sp-duration').value)}));try{await server('apiSetSeminarPresenters',seminarSelected,data);await reload()}catch(e){notice(e)}}
async function addSeminarComment(id){const el=document.getElementById('comment_'+id);try{await server('apiSaveSeminarComment',id,el.value);await reload()}catch(e){notice(e)}}
async function openSeminarPdf(id){try{const url=await server('apiSeminarFileUrl',id);window.open(url,'_blank')}catch(e){notice(e)}}
async function uploadSeminarFile(id){const f=document.getElementById('pdf_'+id).files[0];if(!f)return alert('PDFを選択してください');if(f.size>8*1024*1024)return alert('8MB以下のPDFを選択してください');const reader=new FileReader();reader.onload=async()=>{try{await server('apiUploadSeminarPdf',{seminarId:seminarSelected,presentationId:id,kind:'presentation',filename:f.name,base64:String(reader.result).split(',')[1]});await reload()}catch(e){notice(e)}};reader.readAsDataURL(f)}

let liveState=null,liveTimer=null;
const liveTime=iso=>iso?new Date(iso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—';
const liveDuration=(a,b)=>{if(!a)return '00:00';const secs=Math.max(0,Math.floor((new Date(b||Date.now())-new Date(a))/1000));return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')};
async function loadSeminarLive(){const id=seminarSelected;try{const r=await server('apiSeminarLive',id);if(state.tab!=='seminars'||seminarSelected!==id)return;liveState=r;drawSeminarLive();if(liveTimer)clearInterval(liveTimer);liveTimer=setInterval(()=>{if(state.tab==='seminars'&&liveState){const e=document.getElementById('liveElapsed');if(e){const ev=liveState.events,active=[...ev].reverse().find(x=>['presentation_start','presentation_end','break_start','break_end'].includes(x.type));const started=active&&['presentation_start','break_start'].includes(active.type)?active.at:ev.find(x=>x.type==='seminar_start')?.at;e.textContent=liveDuration(started)}}else{clearInterval(liveTimer);liveTimer=null}},1000)}catch(e){const el=document.getElementById('liveBody');if(el)el.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}}
function liveControls(sem,active,inBreak,next,names){if(!admin()||sem.locked==='true')return '';if(!sem.liveStatus||sem.liveStatus==='ready')return `<button class="primary" onclick="seminarEvent('seminar_start')">▶ ゼミ開始</button>`;if(sem.liveStatus!=='running')return '';if(active)return `<button class="primary" onclick="seminarEvent('presentation_end','${esc(active)}')">■ 発表終了</button>`;if(inBreak)return `<button class="primary" onclick="seminarEvent('break_end')">休憩終了</button>`;return `${next?`<button class="primary" onclick="seminarEvent('presentation_start','${esc(next.id)}')">▶ ${esc(names[next.memberId])} 発表開始</button>`:''}<button class="secondary" onclick="seminarEvent('break_start')">休憩開始</button><button class="secondary" onclick="seminarEvent('seminar_end')">ゼミ終了</button>`;}
function drawSeminarLive(){const r=liveState,sem=r.seminar,ev=r.events,notes=r.notes,ps=t('SeminarPresentations').filter(x=>x.seminarId===sem.id).sort((a,b)=>Number(a.position)-Number(b.position)),members=t('Members'),names=Object.fromEntries(members.map(x=>[x.id,x.name]));const active=(()=>{let p='';for(const e of ev){if(e.type==='presentation_start')p=e.presentationId;if(e.type==='presentation_end')p=''}return p})();let inBreak=false;for(const e of ev){if(e.type==='break_start')inBreak=true;if(e.type==='break_end')inBreak=false}const last=ev[ev.length-1],started=ev.find(e=>e.type==='seminar_start'),ended=sem.liveStatus==='ended',canNote=(sem.locked!=='true'||admin())&&(admin()||sem.scribeId===state.user?.id);const next=ps.find(p=>!ev.some(e=>e.type==='presentation_start'&&e.presentationId===p.id));const options=ps.map(p=>`<option value="${esc(p.id)}">${esc(names[p.memberId]||p.memberId)}</option>`).join('');const el=document.getElementById('liveBody');if(!el)return;el.innerHTML=`<div class="row" style="flex-wrap:wrap"><div><div class="muted">現在</div><div style="font-size:20px;font-weight:700">${active?esc(names[ps.find(p=>p.id===active)?.memberId]||'発表中'):inBreak?'休憩中':ended?'終了':'待機中'}</div><div style="font-size:32px;font-weight:750;font-variant-numeric:tabular-nums" id="liveElapsed">${liveDuration(last?.at)}</div></div><div class="actions">${liveControls(sem,active,inBreak,next,names)}${admin()&&ended&&sem.locked!=='true'?`<button class="primary" onclick="approveSeminarMinutes()">議事録を承認・確定</button>`:''}</div></div>
${admin()&&sem.locked!=='true'?`<div class="form"><div><label>議事録担当</label><select id="liveScribe"><option value="">未指定</option>${members.map(m=>`<option value="${esc(m.id)}" ${sem.scribeId===m.id?'selected':''}>${esc([m.nameJa,m.nameEn].filter(Boolean).join(' / ')||m.name)}</option>`).join('')}</select></div><div style="align-self:end"><button class="secondary" onclick="saveSeminarScribe()">担当者を保存</button></div></div>`:''}
<div class="item"><b>実際の進行</b>${ev.length?ev.map(e=>`<div class="muted">${liveTime(e.at)} · ${esc(({seminar_start:'ゼミ開始',presentation_start:'発表開始',presentation_end:'発表終了',break_start:'休憩開始',break_end:'休憩終了',seminar_end:'ゼミ終了'})[e.type]||e.type)} ${esc(names[ps.find(p=>p.id===e.presentationId)?.memberId]||'')}</div>`).join(''):'<p>開始前です。</p>'}</div>
${canNote?`<div class="item"><h3>議事録メモを追加</h3><div class="form"><div><label>対象</label><select id="liveNotePresenter"><option value="">ゼミ全体</option>${options}</select></div><div><label>区分</label><select id="liveNoteKind" onchange="document.getElementById('liveTaskFields').style.display=this.value==='task'?'grid':'none'"><option value="question">質疑</option><option value="task">指摘・課題</option><option value="memo">メモ</option></select></div></div><div class="form" id="liveTaskFields" style="display:none"><div><label>担当者</label><select id="liveAssignee"><option value="">未指定</option>${members.map(m=>`<option value="${esc(m.id)}">${esc([m.nameJa,m.nameEn].filter(Boolean).join(' / ')||m.name)}</option>`).join('')}</select></div><div><label>期限</label><input type="date" id="liveDue"></div></div><textarea id="liveNoteBody" rows="3" placeholder="質疑・指摘事項を入力"></textarea><div class="actions"><button class="primary" onclick="saveLiveNote()">メモを保存</button></div></div>`:''}
<div class="item"><b>記録済みメモ・課題</b>${notes.length?notes.map(n=>`<div class="item"><span class="tag">${esc(({question:'質疑',task:'課題',memo:'メモ'})[n.kind])}</span> ${esc(n.body)} <span class="muted">${esc(names[n.assigneeId]||'')} ${esc(n.dueDate||'')}</span>${n.kind==='task'?(admin()||state.user?.id===n.assigneeId?`<select style="max-width:150px" onchange="updateLiveTask('${esc(n.id)}',this.value)">${[['open','未対応'],['in_progress','対応中'],['done','完了']].map(([v,l])=>`<option value="${v}" ${n.status===v?'selected':''}>${l}</option>`).join('')}</select>`:` <span class="tag">${esc(n.status)}</span>`):''}</div>`).join(''):'<p>メモはまだありません。</p>'}</div><div class="actions"><button class="secondary" onclick="previewSeminarMinutes()">議事録プレビュー</button></div><pre id="liveMinutesPreview" style="white-space:pre-wrap;font:inherit;font-size:13px"></pre>`}
async function seminarEvent(type,id=''){if(type==='seminar_end'&&!confirm('ゼミを終了しますか？'))return;try{await server('apiSeminarEvent',seminarSelected,type,id);await loadSeminarLive()}catch(e){notice(e)}}
async function saveSeminarScribe(){try{await server('apiSetSeminarScribe',seminarSelected,document.getElementById('liveScribe').value);await loadSeminarLive()}catch(e){notice(e)}}
async function saveLiveNote(){const b=document.getElementById('liveNoteBody').value,k=document.getElementById('liveNoteKind').value;if(!b.trim())return alert('内容を入力してください');try{await server('apiSeminarAddNote',seminarSelected,document.getElementById('liveNotePresenter').value,k,b,k==='task'?document.getElementById('liveAssignee').value:'',k==='task'?document.getElementById('liveDue').value:'');await loadSeminarLive()}catch(e){notice(e)}}
async function updateLiveTask(id,status){try{await server('apiSeminarTaskStatus',id,status);await loadSeminarLive()}catch(e){notice(e)}}
async function previewSeminarMinutes(){try{document.getElementById('liveMinutesPreview').textContent=await server('apiSeminarMinutesPreview',seminarSelected)}catch(e){notice(e)}}
async function approveSeminarMinutes(){if(!confirm('議事録を承認し、学生の編集を停止しますか？'))return;try{await server('apiApproveSeminarMinutes',seminarSelected);await reload()}catch(e){notice(e)}}

let latestDays=30,latestJournal='all',latestData=null,latestRequest=0;
async function loadLatestResearch(force=false){const seq=++latestRequest;const el=document.getElementById('latestResults');if(!el)return;el.innerHTML='<p>最新論文を取得中...</p>';try{const data=await server('apiLatestResearch',latestDays,force);if(seq!==latestRequest||state.tab!=='latest')return;latestData=data;const sel=document.getElementById('latestJournal');if(sel){sel.innerHTML='<option value="all">すべての雑誌</option>'+data.journals.map(j=>`<option value="${esc(j.issn)}" ${latestJournal===j.issn?'selected':''}>${esc(j.name)}</option>`).join('');if(latestJournal!=='all'&&!data.journals.some(j=>j.issn===latestJournal))latestJournal='all';sel.value=latestJournal}drawLatestResearch()}catch(e){el.innerHTML=`<div class="error">取得できませんでした：${esc(e.message)}</div>`}}
function drawLatestResearch(){const el=document.getElementById('latestResults');if(!el||!latestData)return;const journals=latestData.journals.filter(j=>latestJournal==='all'||j.issn===latestJournal);el.innerHTML=(latestData.errors.length?`<div class="error">一部の雑誌で取得できませんでした：${esc(latestData.errors.join(' / '))}</div>`:'')+journals.map(j=>`<details class="latest-journal" style="margin-bottom:10px;border:1px solid #e1e5eb;border-radius:10px;padding:12px"><summary style="cursor:pointer;font-weight:700;display:list-item">${esc(j.name)}（${j.articles.length}件） <span class="muted" style="font-size:12px;font-weight:400">＋ 開く／閉じる</span></summary><div style="margin-top:12px">${j.articles.length?j.articles.map(a=>`<div class="item"><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(a.title)}</b></a><div class="muted">${esc(a.date)} · ${esc(a.authors)} · DOI: ${esc(a.doi)}</div></div>`).join(''):'<p>指定期間内に取得できた論文はありません。</p>'}</div></details>`).join('')+`<p class="muted">Crossrefの登録情報に基づきます。掲載日の遅延・未登録や各誌最大100件の取得上限があります。更新確認：${esc(latestData.updatedAt.slice(0,16).replace('T',' '))} UTC</p>`;const manage=document.getElementById('latestManage');if(manage)manage.innerHTML=latestData.journals.map(j=>`<div class="row item"><span>${esc(j.name)} (${esc(j.issn)})</span><button class="secondary" onclick="removeLatestJournal('${esc(j.issn)}')">削除</button></div>`).join('')}

async function addLatestJournal(event){event.preventDefault();const form=event.target;try{await server('apiLatestAddJournal',form.elements.name.value,form.elements.issn.value);latestJournal='all';loadLatestResearch(true)}catch(e){notice(e)}return false}

function bilingualize(root=document.body){
 // Translate only complete labels. Partial matching corrupted already bilingual
 // headings (e.g. 現在の在室状況 / Current Presence).
 const translateLabel = value => {
   const match = value.match(/^(\s*)(.*?)(\s*)$/s);
   if(!match)return value;
   const original=match[2];
   return match[1]+(BILINGUAL_MAP[original]||original)+match[3];
 };
 const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
 nodes.forEach(n=>{
   if(['SCRIPT','STYLE','OPTION'].includes(n.parentElement?.tagName))return;
   const next=translateLabel(n.nodeValue);
   if(next!==n.nodeValue)n.nodeValue=next;
 });
 document.querySelectorAll('option').forEach(n=>{
   if(n.dataset.bilingualDone)return;
   n.textContent=translateLabel(n.textContent);
   n.dataset.bilingualDone='1';
 });
 document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(n=>{
   if(n.dataset.bilingualPlaceholder)return;

   n.dataset.bilingualPlaceholder='1';
 });
}
